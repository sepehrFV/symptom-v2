# =============================================================================
# CARDIOVASCULAR DISEASE KNOWLEDGE BASE (dog + cat)
#
# HOW TO READ / EDIT
#   prior   : relative frequency of the disease among cardiac patients of that
#             species (dog / cat). 0 or missing = species not affected.
#   age     : relative age multipliers (young <1y, adult 1-7y, senior >7y);
#             normalised automatically so the population-average multiplier = 1.
#   breed   : relative breed-group multipliers (see settings.yaml). Missing = 1.
#   signs   : P(sign | disease) as a GRADE (A..G, see settings.yaml) for animals
#             that are clinically presenting. Signs not listed use the sign's
#             background "leak" rate (signs.yaml). Species-specific differences
#             go to signs_dog / signs_cat which override `signs`.
#   stage_weights : (optional) share of presenting cases per stage.
#   urgency : emergency | urgent | routine  (used for triage context only)
#
# EVERY NUMBER IS AN EXPERT-ELICITED ESTIMATE DRAFTED FROM THE GENERAL REFERENCES
# IN references.yaml. They are NOT extracted from a single dataset. They are the
# first thing a board-certified cardiologist should review (see review/ sheet).
# status: draft_ai_pending_vet_review  (change to `reviewed` + reviewer name once checked)
# =============================================================================
diseases:

