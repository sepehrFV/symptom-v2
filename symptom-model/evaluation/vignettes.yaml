# =============================================================================
# CLINICAL VIGNETTES  -  the "unit tests" of the diagnosis system
#
# Each vignette is a short case with the answers a user would give and the
# outcome a veterinary cardiologist would EXPECT. They are the quickest way
# for senior veterinarians to challenge the system: edit/add cases here and run
#       python evaluate.py --vignettes-only
#
# expect keys (all optional, all must hold):
#   top1_in        : the #1 cardiac disease is one of these ids
#   top3_any       : at least one of these ids is within the top 3
#   top3_all       : every one of these ids is within the top 3
#   not_top1       : the #1 disease must NOT be one of these
#   cardiac_in     : cardiac-likelihood band in [high, moderate, low, very_low]
#   triage_min     : emergency | urgent | routine   (at least this urgent)
#   nc_cause_top   : most likely NON-cardiac syndrome id
#
# AUTHORSHIP: drafted by the AI assistant from textbook prototypes together with
# the KB. They therefore test internal consistency + textbook behaviour, NOT real
# world accuracy. Senior-vet review of expectations is required.
# status: draft_ai_pending_vet_review
# =============================================================================
vignettes:
