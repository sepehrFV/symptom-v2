# =============================================================================
# SIGN VOCABULARY  (single source of truth for questions shown to the user)
#
#   level  : owner   = something an owner can observe at home
#            history = something an owner knows from earlier vet visits / history
#            exam    = clinician physical-examination finding
#            test    = result of a diagnostic test (ECG, radiographs, echo, lab)
#   group  : physiological cluster; used by the case simulator to model disease
#            stage (e.g. congestion signs appear only late) -> correlated signs
#   leak   : P(sign reported | a cardiac disease that does NOT list this sign)
#            i.e. the background rate; keeps the Bayesian engine from zeroing a
#            disease because of a single unexpected finding.
#   parent : "umbrella" sign. The parent is only used by the engine when none of
#            its children has been answered (prevents double counting).
#   codes  : legacy numeric codes of the old Java SymptomEnum (traceability only)
#   red_flag: shown as a triage banner when the sign is answered "yes"
# =============================================================================
version: 2

signs:
  # ---------------------------------------------------------------- OWNER ----
  - id: cough
    codes: [9]
    level: owner
    group: left_congestion
    leak: 0.04
    en: "Cough"
    fa: "سرفه"
    ask_en: "Does the animal cough (especially at night, at rest, or after activity)?"
    ask_fa: "آیا حیوان سرفه می‌کند؟ (به‌ویژه شب‌ها، هنگام استراحت یا بعد از فعالیت)"
    hint_fa: "سرفه در سگ‌ها شایع‌تر است. در گربه‌ها سرفه ناشی از قلب نادر است و معمولاً به بیماری راه‌های هوایی (مثل آسم) مربوط می‌شود."

  - id: dyspnea
    codes: [14, 53]
    level: owner
    group: left_congestion
    leak: 0.04
    en: "Labored breathing (dyspnea)"
    fa: "مشکل در تنفس"
    ask_en: "At rest, does the animal breathe with visible effort (belly heaving, neck stretched, elbows out)?"
    ask_fa: "آیا حیوان در حال استراحت با زحمت نفس می‌کشد؟ (حرکت شدید شکم، کشیدن گردن، دور کردن آرنج‌ها از بدن)"
    red_flag:
      urgency: emergency
      fa: "تنگی نفس در حال استراحت یک وضعیت اورژانسی است. حیوان را بدون استرس و بلافاصله نزد دامپزشک ببرید."
      en: "Labored breathing at rest is an emergency. Keep the animal calm and go to a veterinarian immediately."

  - id: tachypnea_resting
    codes: [15]
    level: owner
    group: left_congestion
    leak: 0.05
    en: "Fast resting/sleeping breathing rate"
    fa: "تنفس سریع در حالت استراحت یا خواب"
    ask_en: "Is the breathing rate while asleep or fully relaxed above 30 breaths per minute?"
    ask_fa: "آیا تعداد تنفس حیوان در زمان خواب یا استراحت کامل بیش از ۳۰ بار در دقیقه است؟"
    hint_fa: "وقتی حیوان آرام خوابیده، به‌مدت یک دقیقه تعداد بالا و پایین رفتن قفسه سینه را بشمارید. بیش از ۳۰ (و به‌ویژه بیش از ۴۰) غیرطبیعی است."

  - id: orthopnea
    codes: [58]
    level: owner
    group: left_congestion
    leak: 0.01
    en: "Refuses to lie down / sits upright to breathe"
    fa: "امتناع از دراز کشیدن"
    ask_en: "Does the animal refuse to lie down, or sit/stand with neck extended in order to breathe?"
    ask_fa: "آیا حیوان از دراز کشیدن خودداری می‌کند یا برای نفس کشیدن می‌نشیند/می‌ایستد و گردنش را دراز می‌کند؟"
    red_flag:
      urgency: urgent
      fa: "امتناع از دراز کشیدن به‌دلیل تنگی نفس نشانهٔ هشدار است؛ در اولین فرصت معاینهٔ دامپزشکی لازم است."
      en: "Refusing to lie down because of breathing difficulty is a warning sign; veterinary examination is needed promptly."

  - id: open_mouth_breathing
    codes: [27]
    level: owner
    group: left_congestion
    leak: 0.05
    en: "Panting / open-mouth breathing at rest"
    fa: "نفس‌نفس زدن یا تنفس با دهان باز در حال استراحت"
    ask_en: "Does the animal pant or breathe with an open mouth while resting (not after exercise or heat)?"
    ask_fa: "آیا حیوان در حال استراحت (نه بعد از فعالیت یا گرما) نفس‌نفس می‌زند یا با دهان باز نفس می‌کشد؟"
    red_flag:
      urgency: emergency
      species: [cat]
      fa: "تنفس با دهان باز در گربه اورژانسی است. بلافاصله به دامپزشک مراجعه کنید."
      en: "Open-mouth breathing in a cat is an emergency. See a veterinarian immediately."

  - id: hemoptysis
    codes: [59]
    level: owner
    group: other
    leak: 0.005
    en: "Coughing up blood"
    fa: "سرفهٔ خونی"
    ask_en: "Has the animal coughed up blood or blood-tinged froth?"
    ask_fa: "آیا حیوان خون یا کف صورتی‌رنگ سرفه کرده است؟"

  - id: exercise_intolerance
    codes: [32]
    level: owner
    group: low_output
    leak: 0.08
    en: "Exercise intolerance"
    fa: "عدم تحمل فعالیت"
    ask_en: "Does the animal tire sooner than before or avoid walks and play?"
    ask_fa: "آیا حیوان نسبت به قبل زودتر خسته می‌شود یا از پیاده‌روی و بازی خودداری می‌کند؟"

  - id: lethargy
    codes: [13]
    level: owner
    group: constitutional
    leak: 0.15
    en: "Lethargy / reduced activity"
    fa: "بی‌حالی و کم‌تحرکی"
    ask_en: "Is the animal unusually quiet, sleepy or less active than normal?"
    ask_fa: "آیا حیوان به‌طور غیرعادی کم‌تحرک، خواب‌آلود یا بی‌حال است؟"

  - id: weakness
    codes: [10, 36]
    level: owner
    group: low_output
    leak: 0.10
    en: "Generalised weakness"
    fa: "ضعف عمومی"
    ask_en: "Is the animal weak or wobbly (legs giving way, difficulty rising)?"
    ask_fa: "آیا حیوان ضعیف یا ناپایدار است؟ (خم شدن پاها، دشواری در بلند شدن)"

  - id: syncope
    codes: [42]
    level: owner
    group: rhythm
    leak: 0.02
    en: "Fainting (syncope)"
    fa: "غش"
    ask_en: "Has the animal had episodes of sudden, brief loss of consciousness with spontaneous full recovery?"
    ask_fa: "آیا حیوان دچار دوره‌هایی از از دست رفتن ناگهانی و کوتاه‌مدت هوشیاری شده که خودبه‌خود و کامل بهبود می‌یابد؟"
    hint_fa: "غش اغلب هنگام هیجان یا فعالیت رخ می‌دهد و با تشنج متفاوت است (معمولاً بدون تشنج طولانی، کف دهان یا ادرار و مدفوع غیرارادی)."
    red_flag:
      urgency: urgent
      fa: "غش می‌تواند نشانهٔ اختلال ریتم یا بیماری جدی قلبی باشد؛ معاینهٔ قلبی در اسرع وقت لازم است."
      en: "Fainting can indicate a serious rhythm or heart problem; cardiac assessment is needed soon."

  - id: collapse
    codes: [43]
    level: owner
    group: low_output
    leak: 0.03
    en: "Collapse (sudden inability to stand)"
    fa: "افتادن ناگهانی (ناتوانی در ایستادن)"
    ask_en: "Has the animal suddenly collapsed and been unable to stand (with or without losing consciousness)?"
    ask_fa: "آیا حیوان ناگهان افتاده و نتوانسته بایستد؟ (با یا بدون از دست دادن هوشیاری)"
    red_flag:
      urgency: emergency
      fa: "کولاپس ناگهانی اورژانسی است؛ فوراً به نزدیک‌ترین مرکز دامپزشکی مراجعه کنید."
      en: "Sudden collapse is an emergency; go to the nearest veterinary clinic immediately."

  - id: seizure_like
    codes: [1]
    level: owner
    group: neuro
    leak: 0.02
    en: "Seizure-like episodes"
    fa: "حمله‌های تشنج‌مانند"
    ask_en: "Has the animal had seizure-like episodes (stiffening, paddling, prolonged unresponsiveness)?"
    ask_fa: "آیا حیوان حمله‌های تشنج‌مانند داشته است؟ (سفت شدن بدن، حرکات پارویی، پاسخ‌ندادن طولانی)"

  - id: pale_gums
    codes: [8, 63]
    level: owner
    group: low_output
    leak: 0.05
    en: "Pale gums"
    fa: "رنگ‌پریدگی لثه"
    ask_en: "Are the gums pale pink or white?"
    ask_fa: "آیا لثه‌ها کم‌رنگ (صورتی روشن یا سفید) هستند؟"

  - id: cyanosis
    codes: [48]
    level: owner
    group: other
    leak: 0.01
    en: "Blue/purple gums or tongue (cyanosis)"
    fa: "کبودی یا آبی‌شدن لثه و زبان"
    ask_en: "Are the gums or tongue blue or purple?"
    ask_fa: "آیا لثه یا زبان آبی یا بنفش شده است؟"
    red_flag:
      urgency: emergency
      fa: "کبودی لثه و زبان نشانهٔ کمبود شدید اکسیژن است و اورژانسی است."
      en: "Blue gums or tongue indicate severe oxygen deficiency and are an emergency."

  - id: cold_extremities
    codes: [22]
    level: owner
    group: thrombo
    leak: 0.03
    en: "Cold paws / extremities"
    fa: "سردی پنجه‌ها و اندام‌ها"
    ask_en: "Do the paws or limbs feel unusually cold?"
    ask_fa: "آیا پنجه‌ها یا اندام‌ها به‌طور غیرعادی سرد هستند؟"

  - id: abdominal_distension
    codes: [11]
    level: owner
    group: right_congestion
    leak: 0.03
    en: "Swollen abdomen (ascites)"
    fa: "بزرگ شدن شکم (آسیت)"
    ask_en: "Has the abdomen become swollen or fluid-filled (while the animal is losing muscle)?"
    ask_fa: "آیا شکم حیوان متورم یا پر از مایع شده است؟ (گاهی همراه با لاغری عضلات)"

  - id: limb_edema
    codes: [41, 68]
    level: owner
    group: right_congestion
    leak: 0.01
    en: "Swollen limbs (edema)"
    fa: "ورم اندام‌ها"
    ask_en: "Are the limbs swollen (pitting edema)?"
    ask_fa: "آیا اندام‌ها ورم کرده‌اند؟"

  - id: decreased_appetite
    codes: [31, 35]
    level: owner
    group: constitutional
    leak: 0.12
    en: "Decreased appetite"
    fa: "کاهش اشتها"
    ask_en: "Has the appetite decreased?"
    ask_fa: "آیا اشتهای حیوان کم شده است؟"

  - id: weight_loss
    codes: [2]
    level: owner
    group: constitutional
    leak: 0.08
    en: "Weight / muscle loss"
    fa: "کاهش وزن یا لاغری عضلانی"
    ask_en: "Has the animal lost weight or muscle mass?"
    ask_fa: "آیا حیوان وزن یا توده عضلانی از دست داده است؟"

  - id: vomiting
    codes: [24]
    level: owner
    group: constitutional
    leak: 0.06
    en: "Vomiting"
    fa: "استفراغ"
    ask_en: "Is the animal vomiting?"
    ask_fa: "آیا حیوان استفراغ می‌کند؟"

  - id: regurgitation
    codes: [38]
    level: owner
    group: gi_esophageal
    leak: 0.01
    en: "Regurgitation"
    fa: "برگشت غذای هضم‌نشده"
    ask_en: "Does undigested food come back up effortlessly (without retching), especially after meals?"
    ask_fa: "آیا غذای هضم‌نشده بدون زور زدن و عق زدن (به‌ویژه بعد از غذا) برمی‌گردد؟"

  - id: dysphagia
    codes: [34, 56]
    level: owner
    group: gi_esophageal
    leak: 0.01
    en: "Difficulty swallowing"
    fa: "مشکل در بلع"
    ask_en: "Does the animal have difficulty swallowing?"
    ask_fa: "آیا حیوان در بلع غذا یا آب مشکل دارد؟"

  - id: polyuria_polydipsia
    codes: [5, 50]
    level: owner
    group: systemic
    leak: 0.04
    en: "Increased drinking and urination"
    fa: "افزایش نوشیدن آب و ادرار"
    ask_en: "Is the animal drinking and urinating much more than before? (Tell us if this started only after diuretic treatment.)"
    ask_fa: "آیا حیوان بسیار بیشتر از قبل آب می‌نوشد و ادرار می‌کند؟ (اگر فقط پس از شروع داروی ادرارآور بوده، توضیح دهید.)"

  - id: polyphagia
    codes: [29]
    level: owner
    group: systemic
    leak: 0.02
    en: "Increased appetite"
    fa: "افزایش اشتها"
    ask_en: "Is the appetite increased (ravenous) despite weight loss?"
    ask_fa: "آیا اشتهای حیوان با وجود کاهش وزن زیاد شده است؟"

  - id: hind_limb_paralysis
    codes: [28, 52, 61]
    level: owner
    group: thrombo
    leak: 0.005
    en: "Sudden hind-limb paralysis"
    fa: "فلج ناگهانی اندام‌های عقبی"
    ask_en: "Did the hind limbs suddenly become paralysed or unable to bear weight?"
    ask_fa: "آیا اندام‌های عقبی ناگهان فلج شده یا حیوان نمی‌تواند روی آن‌ها بایستد؟"
    red_flag:
      urgency: emergency
      fa: "فلج ناگهانی اندام عقبی (به‌ویژه در گربه) می‌تواند نشانهٔ لختهٔ شریانی باشد و اورژانسی است."
      en: "Sudden hind-limb paralysis (especially in cats) can indicate an arterial clot and is an emergency."

  - id: painful_limbs
    codes: [45, 39]
    level: owner
    group: thrombo
    leak: 0.01
    en: "Severe limb pain / crying out"
    fa: "درد شدید اندام و ناله"
    ask_en: "Is there sudden severe limb pain with crying or vocalising?"
    ask_fa: "آیا درد شدید ناگهانی در اندام‌ها همراه با ناله و فریاد وجود دارد؟"

  - id: sudden_blindness
    codes: [30]
    level: owner
    group: systemic
    leak: 0.005
    en: "Sudden blindness / dilated pupils"
    fa: "کوری ناگهانی یا مردمک‌های گشاد"
    ask_en: "Did the animal suddenly go blind, bump into objects, or have widely dilated pupils?"
    ask_fa: "آیا حیوان ناگهان بینایی‌اش را از دست داده، به اشیا می‌خورد یا مردمک‌هایش بسیار گشاد است؟"

  - id: dark_urine
    codes: [60]
    level: owner
    group: other
    leak: 0.005
    en: "Dark red/brown urine"
    fa: "ادرار قرمز تیره یا قهوه‌ای"
    ask_en: "Is the urine dark red or coffee-coloured?"
    ask_fa: "آیا ادرار قرمز تیره یا قهوه‌ای است؟"

  - id: failure_to_thrive
    codes: [55]
    level: owner
    group: constitutional
    leak: 0.01
    en: "Poor growth (young animals)"
    fa: "رشد ضعیف (در حیوانات جوان)"
    ask_en: "(Young animals) Is the animal smaller or slower-growing than littermates?"
    ask_fa: "(در حیوانات جوان) آیا حیوان از هم‌کوری‌هایش کوچک‌تر است یا کندتر رشد می‌کند؟"

  - id: restlessness
    codes: [7, 64]
    level: owner
    group: left_congestion
    leak: 0.04
    en: "Restlessness, especially at night"
    fa: "بی‌قراری به‌ویژه شب‌ها"
    ask_en: "Is the animal restless at night, unable to settle or find a comfortable position?"
    ask_fa: "آیا حیوان شب‌ها بی‌قرار است و نمی‌تواند آرام بگیرد یا وضعیت راحتی پیدا کند؟"

  # -------------------------------------------------------------- HISTORY ----
  - id: heart_murmur
    codes: [18]
    level: history
    group: structural
    leak: 0.04
    en: "Heart murmur"
    fa: "سوفل قلبی"
    ask_en: "Has a veterinarian ever told you the animal has a heart murmur?"
    ask_fa: "آیا دامپزشک تا به حال به شما گفته که حیوان سوفل (صدای اضافه) قلبی دارد؟"
    ask_clinician_en: "Is a heart murmur present on auscultation?"
    ask_clinician_fa: "آیا در سمع قلب سوفل شنیده می‌شود؟"

  - id: heartworm_exposure
    codes: []
    level: history
    group: systemic
    leak: 0.04
    en: "Heartworm exposure (endemic area without prevention, or positive test)"
    fa: "مواجهه با کرم قلب"
    ask_en: "Does the animal live in or travel to a heartworm-endemic (mosquito) area without regular preventive treatment, or has it tested positive?"
    ask_fa: "آیا حیوان در منطقهٔ آلوده به کرم قلب (دیروفیلاریا؛ مناطق گرم و مرطوب با پشه) زندگی می‌کند یا سفر کرده و پیشگیری منظم نداشته است؟ یا تست مثبت داشته است؟"

  - id: family_history_cardiac
    codes: []
    level: history
    group: structural
    leak: 0.05
    en: "Family history of heart disease / sudden death"
    fa: "سابقهٔ خانوادگی بیماری قلبی"
    ask_en: "Is there a known family history of heart disease or sudden death (parents, siblings, same lineage)?"
    ask_fa: "آیا سابقهٔ بیماری قلبی یا مرگ ناگهانی در والدین، هم‌کوری‌ها یا همان خط خونی شناخته شده است؟"

  - id: thromboembolic_risk
    codes: []
    level: history
    group: systemic
    leak: 0.03
    en: "Thrombosis-predisposing condition"
    fa: "بیماری زمینه‌ای مستعدکنندهٔ لخته"
    ask_en: "Does the animal have a clot-predisposing condition (IMHA, protein-losing kidney/gut disease, Cushing's, cancer, sepsis, recent major surgery or immobility)?"
    ask_fa: "آیا بیماری زمینه‌ای مستعدکنندهٔ لخته دارد؟ (کم‌خونی همولیتیک ایمنی، دفع پروتئین از کلیه یا روده، کوشینگ، سرطان، سپسیس، جراحی بزرگ یا بی‌حرکتی اخیر)"

  - id: predisposing_infection
    codes: []
    level: history
    group: systemic
    leak: 0.04
    en: "Recent source of infection (dental, skin, urinary, discospondylitis)"
    fa: "کانون عفونی اخیر"
    ask_en: "Recent or ongoing infection source (dental disease, skin/wound infection, urinary tract infection, back pain/discospondylitis)?"
    ask_fa: "آیا کانون عفونی اخیر یا مداوم وجود دارد؟ (بیماری دندان، عفونت پوست یا زخم، عفونت ادراری، درد ستون مهره)"

  # ----------------------------------------------------------------- EXAM ----
  - id: murmur_left_apical_systolic
    codes: []
    level: exam
    group: structural
    parent: heart_murmur
    leak: 0.02
    en: "Systolic murmur, left apex (mitral area)"
    fa: "سوفل سیستولیک آپکس چپ (ناحیهٔ میترال)"
    ask_en: "Systolic murmur loudest at the left apex (mitral area)?"
    ask_fa: "آیا سوفل سیستولیک با بیشترین شدت در آپکس چپ (ناحیهٔ میترال) شنیده می‌شود؟"

  - id: murmur_left_basilar_systolic
    codes: []
    level: exam
    group: structural
    parent: heart_murmur
    leak: 0.02
    en: "Systolic ejection murmur, left base (aortic/pulmonic area)"
    fa: "سوفل سیستولیک قاعدهٔ قلب سمت چپ (ناحیهٔ آئورت/ریوی)"
    ask_en: "Systolic ejection murmur loudest at the left heart base (aortic/pulmonic area)?"
    ask_fa: "آیا سوفل سیستولیک (جهشی) با بیشترین شدت در قاعدهٔ چپ قلب (ناحیهٔ آئورت/ریوی) شنیده می‌شود؟"

  - id: murmur_right_systolic
    codes: []
    level: exam
    group: structural
    parent: heart_murmur
    leak: 0.01
    en: "Systolic murmur, right side (tricuspid area)"
    fa: "سوفل سیستولیک سمت راست (ناحیهٔ تری‌کاسپید)"
    ask_en: "Systolic murmur loudest on the right hemithorax (tricuspid area)?"
    ask_fa: "آیا سوفل سیستولیک با بیشترین شدت در سمت راست قفسه سینه (ناحیهٔ تری‌کاسپید) شنیده می‌شود؟"

  - id: murmur_continuous
    codes: []
    level: exam
    group: structural
    parent: heart_murmur
    leak: 0.003
    en: "Continuous (\"machinery\") murmur, left base"
