# =============================================================================
# NON-CARDIAC ("other cause") HYPOTHESIS
# A pet that coughs, tires easily or is lethargic often does NOT have heart
# disease. Without this competing hypothesis any pet with a couple of vague
# signs would be forced into a cardiac diagnosis. It is modelled as a mixture of
# common non-cardiac syndromes (weights are relative, per species).
# Sign grades use the same A..G scale as diseases.yaml.
# =============================================================================
profiles:
- id: airway_disease
  name_en: Airway / upper-airway disease (tracheal collapse, chronic bronchitis, feline asthma, laryngeal paralysis, brachycephalic airway syndrome)
  name_fa: "بیماری راه‌های هوایی (کلاپس نای، برونشیت مزمن، آسم گربه، فلج حنجره، سندرم راه هوایی براکی‌سفال)"
  weight: {dog: 0.22, cat: 0.20}
  age: {young: 0.6, adult: 1.0, senior: 1.3}
  signs:
    cough: B
    dyspnea: D
    tachypnea_resting: D
    open_mouth_breathing: C
    exercise_intolerance: C
    lethargy: E
    cyanosis: F
    syncope: F
    xray_bronchial_pattern: C
